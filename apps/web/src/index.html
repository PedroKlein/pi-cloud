<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Cloud</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside>
      <h1>Pi Cloud</h1>
      <form id="create">
        <input name="provider" placeholder="provider" required />
        <input name="cwd" placeholder="directory" required />
        <button>New session</button>
      </form>
      <ul id="sessions"></ul>
    </aside>
    <main id="session" hidden>
      <header>
        <span id="title"></span>
        <span id="status"></span>
        <button id="abort" type="button">Stop</button>
        <button id="open-terminal" type="button">Terminal</button>
      </header>
      <ol id="chat"></ol>
      <div id="terminal" hidden></div>
      <form id="prompt">
        <textarea name="text" rows="3" placeholder="Message"></textarea>
        <button>Send</button>
      </form>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
