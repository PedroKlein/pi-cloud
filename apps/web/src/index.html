<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Cloud</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside>
      <h1>Pi Cloud</h1>
      <form id="create">
        <input name="provider" placeholder="provider" required />
        <select name="kind">
          <option value="folder">Folder</option>
          <option value="clone">Clone repository</option>
        </select>
        <input
          name="location"
          placeholder="directory or repository URL"
          required
        />
        <button>New session</button>
      </form>
      <ul id="sessions"></ul>
    </aside>
    <main id="session" hidden>
      <header>
        <span id="title"></span>
        <span id="status"></span>
        <button id="abort" type="button">Stop</button>
        <button id="open-terminal" type="button">Terminal</button>
      </header>
      <ol id="chat"></ol>
      <div id="terminal" hidden></div>
      <div id="widgets-above" class="widgets"></div>
      <form id="prompt">
        <textarea
          id="prompt-text"
          name="text"
          rows="3"
          placeholder="Message"
        ></textarea>
        <button>Send</button>
      </form>
      <div id="widgets-below" class="widgets"></div>
      <footer id="extension-status"></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
