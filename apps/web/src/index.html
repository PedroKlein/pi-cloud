<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pi Cloud</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <aside>
      <h1>Pi Cloud</h1>
      <form id="create">
        <input
          name="provider"
          placeholder="provider"
          list="providers"
          required
        />
        <datalist id="providers"></datalist>
        <select name="kind">
          <option value="worktree">Worktree of folder</option>
          <option value="folder">Folder (shared with other sessions)</option>
          <option value="clone">Clone repository</option>
        </select>
        <input
          name="location"
          placeholder="directory or repository URL"
          list="folders"
          required
        />
        <datalist id="folders"></datalist>
        <input
          name="model"
          placeholder="model (provider default)"
          list="models"
        />
        <datalist id="models"></datalist>
        <button>New session</button>
      </form>
      <ul id="sessions"></ul>
    </aside>
    <main id="session" hidden>
      <header>
        <span id="title"></span>
        <span id="status"></span>
        <button id="abort" type="button">Stop</button>
        <button id="open-terminal" type="button">Terminal</button>
      </header>
      <details id="changes" hidden>
        <summary id="changes-summary"></summary>
        <pre id="changes-stat"></pre>
        <pre id="changes-patch"></pre>
      </details>
      <ol id="chat"></ol>
      <div id="terminal" hidden></div>
      <div id="queued" class="widgets"></div>
      <div id="widgets-above" class="widgets"></div>
      <form id="prompt">
        <textarea
          id="prompt-text"
          name="text"
          rows="3"
          placeholder="Message (Enter steers, Alt+Enter queues a follow-up)"
        ></textarea>
        <button>Send</button>
      </form>
      <div id="widgets-below" class="widgets"></div>
      <footer id="extension-status"></footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
