image:
  repository: ghcr.io/pedroklein/pi-cloud
  # main follows the main branch; pin a sha-<commit> tag for a steady install.
  tag: main
  pullPolicy: IfNotPresent

# Where people open the server, such as https://pi.example.com. The setup link
# in the log points here. Defaults to https://<apiRule.host> on Kyma.
url: ""

# Kyma's gateway, which ends HTTPS in front of the server (ADR 0034).
apiRule:
  enabled: false
  host: ""
  gateway: kyma-system/kyma-gateway

# Runs a runner inside the server too, in the Environment of this name.
builtInRunner: ""

# A Secret with a `secretKey` entry: 32 bytes, base64. When empty, the chart
# makes one on install and keeps it on upgrades.
existingSecret: ""

persistence:
  size: 5Gi
  storageClass: ""

service:
  port: 7420

resources: {}

# Lets the kubernetes plugin start runner pods in this namespace, with a
# service account allowed to manage pods, Secrets and claims here (ADR 0032).
runnerPods:
  enabled: true

# More environment for the server, such as PI_CLOUD_FAUX_REPLY in tests.
extraEnv: []
