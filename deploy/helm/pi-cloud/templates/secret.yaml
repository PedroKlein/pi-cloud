{{- if not .Values.existingSecret }}
{{- $name := include "pi-cloud.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pi-cloud.labels" . | nindent 4 }}
  annotations:
    # Losing the key loses every stored Environment secret.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- if $existing }}
  secretKey: {{ index $existing.data "secretKey" }}
  {{- else }}
  secretKey: {{ randBytes 32 | b64enc }}
  {{- end }}
{{- end }}
