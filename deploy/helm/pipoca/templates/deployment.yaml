apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "pipoca.labels" . | nindent 4 }}
spec:
  # The store is SQLite on a ReadWriteOnce volume (ADR 0034).
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "pipoca.labels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pipoca.labels" . | nindent 8 }}
        {{- if .Values.apiRule.enabled }}
        # APIRules reach only workloads in the Istio mesh.
        sidecar.istio.io/inject: "true"
        {{- end }}
    spec:
      {{- if .Values.runnerPods.enabled }}
      serviceAccountName: {{ .Release.Name }}
      {{- else }}
      automountServiceAccountToken: false
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      {{- if .Values.config }}
      initContainers:
        # Seeds the config folder on the data volume once. After that Settings
        # and people edit the file there (ADR 0039).
        - name: config
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - sh
            - -c
            - mkdir -p /data/config && { test -e /data/config/pipoca.json || test -e /data/config/pi-cloud.json || cp /seed/pipoca.json /data/config/pipoca.json; }
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /seed
              readOnly: true
      {{- end }}
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --port
            - "7420"
            {{- with include "pipoca.url" . }}
            - --url
            - {{ . | quote }}
            {{- end }}
            {{- if (.Values.oidc | default dict).ssoOnly }}
            - --sso-only
            {{- end }}
            {{- with .Values.builtInRunner }}
            - --provider
            - {{ . | quote }}
            {{- end }}
          env:
            # The pod starts the server again when it exits for a restart.
            - name: PIPOCA_SUPERVISED
              value: "1"
            - name: PIPOCA_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "pipoca.secretName" . }}
                  key: secretKey
            {{- if .Values.runnerPods.enabled }}
            - name: PIPOCA_IMAGE
              value: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
            - name: PIPOCA_RUNNER_URL
              value: "http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc:{{ .Values.service.port }}"
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 7420
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-data
        {{- if .Values.config }}
        - name: config
          configMap:
            name: {{ .Release.Name }}-config
        {{- end }}
